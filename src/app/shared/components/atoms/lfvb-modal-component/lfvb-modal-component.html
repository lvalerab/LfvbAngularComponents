@if(tipoVisualizacion=='zorro') {
    <nz-modal [(nzVisible)]="isOpen" [nzTitle]="title" (nzOnCancel)="onClose(null)" (nzOnOk)="onClose({ok:true})" (nzOnCancel)="{ok:false}">
        @if(headerModalTemplate) {
            <<ng-container *nzModalTitle>
                <ng-container [ngTemplateOutlet]="headerModalTemplate">

                </ng-container>
            </ng-container>
        }
        <ng-container *nzModalContent>
             <ng-container [ngTemplateOutlet]="contentModalTemplate">

            </ng-container>
        </ng-container>
        @if(footerModalTemplate) {
            <div *nzModalFooter>
                <ng-container [ngTemplateOutlet]="footerModalTemplate">

                </ng-container>
            </div>
        }
        @else {
            <div *nzModalFooter>
                <lfvbButton (click)="onClose(null)" label="Cerrar"></lfvbButton>
            </div>
        }
    </nz-modal>
}
@else if(tipoVisualizacion=='HTML' || tipoVisualizacion=='angular-material') {
    <dialog #modalDialog (click)="onBackdropClick($event)" (close)="onClose(null)" [style.max-width]="ancho">
        <div class="modal-header" [className]="clsCabecera">
            @if(!headerModalTemplate) {
                <h2>{{ title }}</h2>
                <button class="close-btn" (click)="onClose(null)">×</button>
            }
            @else {
                <ng-container [ngTemplateOutlet]="headerModalTemplate">

                </ng-container>
            }
        </div>
        
        <div class="modal-body">
            <!-- Contenido proyectado dinámicamente -->
            <ng-container [ngTemplateOutlet]="contentModalTemplate">

            </ng-container>
        </div>

        <div class="modal-footer">
            @if(footerModalTemplate) {
                <ng-container [ngTemplateOutlet]="footerModalTemplate">

                </ng-container>
            }
            @else {
                <lfvbButton (click)="onClose(null)" label="Cerrar"></lfvbButton>
            }
        </div>
    </dialog>
}
