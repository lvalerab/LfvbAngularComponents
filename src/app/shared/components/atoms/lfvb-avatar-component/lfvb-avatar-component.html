<span (click)="OnClickAvatar($event)">
    @if(tipoVisualizacion=="zorro") {
        <nz-avatar [nzSize]="nTamanyo" [nzText]="GetIniciales()??''" [nzSrc]="urlImg()??''"></nz-avatar>
    }
    @else {
        <div [style.width]="nTamanyo+'px'" [style.height]="nTamanyo+'px'" [style.border-radius]="tipoAvatar?'50%':'5%'">
            @if(urlImg()) {
                <img style="width: 100%; height: 100%; object-fit: cover;" [src]="urlImg()??''" [title]="GetIniciales()"/>
            } 
            @else {
                <span style="width: 100%; height: 100%; object-fit: cover;">{{GetIniciales()}}</span>
            }
        </div>
    }
</span>
